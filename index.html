<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contador de muertes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container" style="width:300px;">
    <div class="d-flex align-items-center justify-content-center"
         style="gap:20px;border-bottom:solid red 3px;">

        <p style="margin:0;">Total de muertes:</p>

        <h1 id="contador" style="margin:0;color:red;">0</h1>

        <img src="https://ih1.redbubble.net/image.1373072963.3205/flat,750x1000,075,f.jpg"
             style="width:50px">
    </div>
</div>

<script>
async function actualizar(){
    const r = await fetch("/api/count");
    const data = await r.json();
    document.getElementById("contador").textContent = data.count;
}

actualizar();
setInterval(actualizar, 1000);
</script>

</body>
</html>
