<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contador de muertes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent !important;
}

.container {
    width: 300px;
}
#contador{
    margin:0;
    color:red;
    display:inline-block;
    transform-origin:center;
    text-shadow:0 0 0 rgba(255,0,0,0);
}

#contador.actualizado{
    animation: muertePop .55s ease-out;
}

@keyframes muertePop{
    0%{
        transform:scale(1);
        text-shadow:0 0 0 rgba(255,0,0,0);
    }

    20%{
        transform:scale(1.45) rotate(-3deg);
        text-shadow:0 0 20px rgba(255,0,0,.9);
    }

    35%{
        transform:translateX(-4px) scale(1.3);
    }

    45%{
        transform:translateX(4px) scale(1.25);
    }

    60%{
        transform:translateX(-2px) scale(1.15);
    }

    100%{
        transform:scale(1);
        text-shadow:0 0 0 rgba(255,0,0,0);
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="d-flex align-items-center justify-content-center"
         style="gap:20px;border-bottom:solid red 3px;">
        <p style="margin:0;">Total de muertes:</p>
        <h1 id="contador" style="margin:0;color:red;">179</h1>
        <img src="https://w7.pngwing.com/pngs/132/187/png-transparent-cheems-dog.png" style="width:50px">
    </div>
</div>

<script>
let ultimoValor = null;

const sonido = new Audio("/sonido.mp3");
sonido.preload = "auto";

const contador = document.getElementById("contador");

async function actualizar() {
    const r = await fetch("/api/count");
    const data = await r.json();

    contador.textContent = data.count;

    if (ultimoValor !== null && data.count !== ultimoValor) {

        sonido.currentTime = 0;
        sonido.play().catch(()=>{});

        contador.classList.remove("actualizado");

        // Reinicia la animación
        void contador.offsetWidth;

        contador.classList.add("actualizado");
    }

    ultimoValor = data.count;
}

actualizar();
setInterval(actualizar, 1000);
</script>

</body>
</html>
