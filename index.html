<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contador de muertes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
html, body{
    margin:0;
    background:transparent;
}

.contador-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    border-bottom:3px solid red;
}

.contador-box p{
    margin:0;
    background-color: rgba(255, 255, 255, 0.5);
    color:black;
}

.numero-wrapper{
    position:relative;
    width:90px;
    height:70px;
    display:flex;
    justify-content:center;
    align-items:center;
}

#contador{
    margin:0;
    color:red;
    position:relative;
    z-index:2;
}

.blood{
    position:absolute;
    width:95px;
    height:95px;
    opacity:0;
    transform:scale(.3) rotate(-20deg);
}

.blood.show{
    animation:bloodSplash .55s ease-out;
}
@keyframes bloodSplash{
    0%{
        opacity:0;
        transform:scale(.3) rotate(-20deg);
    }
    50%{
        opacity:1;
        transform:scale(1.2) rotate(0deg);
    }
    100%{
        opacity:0;
        transform:scale(1.8) rotate(10deg);
    }
}
</style>
</head>
<body>

<div class="container" style="width:300px;">
    <div class="contador-box">
        <p>Total de muertes:</p>

        <div class="numero-wrapper">

            <svg id="blood" viewBox="0 0 200 200" class="blood">
                <path d="M98 20
                         C120 5 150 25 140 50
                         C170 45 185 75 165 95
                         C190 110 170 145 140 140
                         C145 170 115 190 92 168
                         C70 195 35 170 45 140
                         C10 145 -2 105 28 90
                         C8 65 30 35 60 45
                         C55 18 82 5 98 20Z"
                      fill="#8b0000"/>
                <circle cx="35" cy="120" r="8" fill="#8b0000"/>
                <circle cx="155" cy="55" r="6" fill="#8b0000"/>
                <circle cx="150" cy="150" r="10" fill="#8b0000"/>
                <circle cx="55" cy="45" r="5" fill="#8b0000"/>
            </svg>

            <h1 id="contador">0</h1>
            
        </div>

        <img src="https://ih1.redbubble.net/image.1373072963.3205/flat,750x1000,075,f.jpg" style="width:50px">
    </div>
</div>
<script>
let ultimoValor = null;
document.addEventListener("click", () => {
    sonido.play().then(() => {
        sonido.pause();
        sonido.currentTime = 0;
    }).catch(() => {});
}, { once: true });
const blood = document.getElementById("blood");
const sonido = new Audio("/sonido.mp3");

sonido.preload = "auto";

async function actualizar() {
    const r = await fetch("/api/count");
    const data = await r.json();

    document.getElementById("contador").textContent = data.count;

    if (ultimoValor !== null && data.count !== ultimoValor) {

        // Reinicia la animación (funciona en OBS)
        blood.style.animation = "none";
        blood.offsetHeight; // fuerza reflow
        blood.style.animation = "";
        blood.classList.add("show");

        setTimeout(() => blood.classList.remove("show"), 600);

        sonido.currentTime = 0;
        sonido.play().catch(() => {});
    }

    ultimoValor = data.count;
}

actualizar();
setInterval(actualizar, 1000);
</script>
</body>
</html>
