<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contador de muertes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
html, body{
    margin:0;
    background:transparent;
}

.contador-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    border-bottom:3px solid red;
}

.contador-box p{
    margin:0;
    color:white;
}

.numero-wrapper{
    position:relative;
    width:90px;
    height:70px;
    display:flex;
    justify-content:center;
    align-items:center;
}

#contador{
    margin:0;
    color:red;
    position:relative;
    z-index:2;
}

.blood{
    position:absolute;
    width:95px;
    height:95px;
    opacity:0;
    transform:scale(.3) rotate(-20deg);
    transition:none;
}

.blood.show{
    animation:bloodSplash .55s ease-out;
}

@keyframes bloodSplash{
    0%{
        opacity:0;
        transform:scale(.2) rotate(-25deg);
    }
    25%{
        opacity:1;
        transform:scale(1.25) rotate(5deg);
    }
    100%{
        opacity:0;
        transform:scale(1.8) rotate(10deg);
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="d-flex align-items-center justify-content-center"
         style="gap:20px;border-bottom:solid red 3px;">
        <p style="margin:0;">Total de muertes:</p>
        <h1 id="contador" style="margin:0;color:red;">179</h1>
        <img src="https://w7.pngwing.com/pngs/132/187/png-transparent-cheems-dog.png" style="width:50px">
    </div>
</div>

<script>
let ultimoValor = null;

const blood = document.getElementById("blood");
const sonido = new Audio("/sonido.mp3");

sonido.preload = "auto";

async function actualizar() {
    const r = await fetch("/api/count");
    const data = await r.json();

    document.getElementById("contador").textContent = data.count;

    if (ultimoValor !== null && data.count !== ultimoValor) {

        // Reinicia y reproduce el sonido
        sonido.pause();
        sonido.currentTime = 0;
        sonido.play().catch(() => {});

        // Reinicia la animación de la sangre
        blood.classList.remove("show");
        void blood.offsetWidth;
        blood.classList.add("show");
    }

    ultimoValor = data.count;
}

actualizar();
setInterval(actualizar, 1000);
</script>

</body>
</html>
